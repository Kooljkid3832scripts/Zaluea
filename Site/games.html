<!DOCTYPE html>
<html lang="en" data-theme="cherri">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <script>try{var t=localStorage.getItem("z_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <link id="favicon" rel="icon" type="image/png" href="images/logo.png?v=3" />
  <link rel="stylesheet" href="index.css?v=3" />
  <title id="pageTitle">Zaluea | Games</title>
</head>
<body>
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

  <nav class="nav glass">
    <a class="brand" href="/"><span class="logo">Z</span><span class="brand-name"><span>Zaluea</span></span></a>
    <div class="nav-links">
      <a href="/" class="nav-btn">Home</a>
      <a href="games.html" class="nav-btn active">Games</a>
      <button class="nav-btn" id="cloakBtn">🕶 Cloak</button>
      <button class="nav-btn icon" id="settingsBtn">⚙</button>
    </div>
  </nav>

  <main class="hero">
    <h1 class="title" style="font-size:clamp(44px,7vw,72px)">Games<span class="dot">.</span></h1>
    <p class="subtitle">Unblocked, runs locally. Click a card to play.</p>
    <div id="gamesGrid" class="grid"></div>
    <p class="hint">More games coming soon. Want one added? Open a GitHub issue.</p>
  </main>

  <div id="gameWrap" hidden>
    <div id="gameInner">
      <div id="gameBar">
        <strong id="gameName">Game</strong>
        <span class="spacer"></span>
        <button class="card-btn" id="fsBtn">Fullscreen</button>
        <button class="card-btn" id="closeBtn">✕ Close</button>
      </div>
      <iframe id="gameFrame" title="game"></iframe>
    </div>
  </div>

  <div id="drawerOverlay" hidden></div>
  <aside id="drawer" hidden>
    <h2>Settings <button id="drawerClose">✕</button></h2>
    <label class="row-label">Theme</label>
    <div class="theme-grid" id="themeGrid">
      <button class="theme-dot" data-theme-pick="cherri" title="Cherri" style="background:linear-gradient(135deg,#ff6b8b,#c4344f)"></button>
      <button class="theme-dot" data-theme-pick="midnight" title="Midnight" style="background:linear-gradient(135deg,#6ec1ff,#0b0f23)"></button>
      <button class="theme-dot" data-theme-pick="void" title="Void" style="background:linear-gradient(135deg,#a855f7,#0e0018)"></button>
      <button class="theme-dot" data-theme-pick="forest" title="Forest" style="background:linear-gradient(135deg,#6ee7a8,#0c1a12)"></button>
      <button class="theme-dot" data-theme-pick="mono" title="Mono" style="background:linear-gradient(135deg,#e5e5e5,#000)"></button>
    </div>
    <label class="row-label">Tab cloak preset</label>
    <div class="preset-grid">
      <button data-cloak="classroom">Classroom</button>
      <button data-cloak="docs">Google Docs</button>
      <button data-cloak="drive">Google Drive</button>
      <button data-cloak="khan">Khan Academy</button>
      <button data-cloak="clever">Clever</button>
      <button data-cloak="zaluea">Zaluea</button>
    </div>
    <button id="resetBtn" class="card-btn danger">Reset cloak</button>
  </aside>

  <script src="uv/uv.bundle.js?v=3"></script>
  <script src="uv/uv.config.js?v=3"></script>
  <script src="stealth.js?v=3"></script>
  <script src="site.js?v=3"></script>
  <script src="games.js?v=3"></script>
</body>
</html>
